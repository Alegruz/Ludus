# Thanks to Martin Donath, Material for MkDocs, "Getting started", "Setting up
# site search" and "Changing the fonts": use the maintained Markdown theme,
# local search and system fonts rather than maintaining a custom wiki renderer.
# https://squidfunk.github.io/mkdocs-material/; docs/development/wiki.md.
site_name: Ludus Wiki
site_description: Practical guides, explanations and references for using and contributing to Ludus.
site_url: https://alegruz.github.io/Ludus/
repo_url: https://github.com/Alegruz/Ludus
repo_name: Alegruz/Ludus
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  /api-main.md
  /api-undocumented.json
  /Doxyfile
  /wiki-requirements.txt
site_dir: out/wiki
theme:
  name: material
  language: en
  font: false
  logo: assets/ludus.svg
  favicon: assets/ludus.svg
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
plugins:
  - search
hooks:
  - scripts/python/wiki_docs_hook.py
  - scripts/python/wiki_api_hook.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - assets/wiki.css
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
  - Start here: wiki/index.md
  - Getting started:
      - Install and launch: wiki/getting-started/install.md
      - Create your first project: wiki/getting-started/first-project.md
      - Current capabilities: wiki/getting-started/status.md
  - Guides:
      - Editor workspace: development/editor-workspace.md
      - Browser editor: wiki/guides/browser-editor.md
      - Build, run and debug: wiki/guides/build-and-debug.md
      - Projects and setup repair: development/project-sdk-workflow.md
      - Platform targets and compatibility: wiki/guides/platform-targets.md
      - Engine configuration: wiki/guides/configuration.md
      - Filesystem and background reads: wiki/guides/filesystem.md
      - Strings and names: wiki/guides/strings.md
      - Hashing: wiki/guides/hashing.md
      - Deterministic randomness: wiki/guides/randomness.md
      - High-resolution time: wiki/guides/time.md
      - Audio workflow: wiki/guides/audio.md
      - Package and publish a game: development/editor-game-releases.md
      - Troubleshooting: wiki/guides/troubleshooting.md
  - Engine development:
      - Build and initialize: development/building.md
      - Native debugging: development/debugging.md
      - Diagnostics: development/diagnostics.md
      - Live gameplay editing: development/project-live-reload.md
      - Rendering and shaders: development/fullscreen-rendering.md
      - Release packages: development/game-packaging-publishing.md
      - Browser editor build: development/browser-editor.md
  - Samples:
      - Cornell box rendering: examples/cornell-box.md
  - Learn:
      - How Ludus fits together: wiki/learn/architecture.md
      - Reference reading paths: wiki/learn/references.md
      - Glossary: wiki/learn/glossary.md
  - Engine architecture:
      - Architecture map: wiki/architecture/index.md
      - Foundation and jobs: wiki/architecture/foundation.md
      - Startup and shutdown: wiki/architecture/lifecycle.md
      - Platform and rendering: wiki/architecture/rendering.md
      - Terrain and generation: wiki/architecture/terrain.md
      - Worlds and frame updates: wiki/architecture/world.md
      - Content and audio: wiki/architecture/content.md
      - Runtime and editor: wiki/architecture/runtime.md
  - Contribute:
      - Contribute to Ludus: wiki/contribute/index.md
      - Documentation and offline reading: development/wiki.md
      - Document public APIs: development/api-reference.md
  - API reference: wiki/reference/index.md
