<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludus demo</title>
<style>
* { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; padding: 12px; display: flex; flex-direction: column;
  gap: 6px; font: 14px system-ui; background: #151923; color: #eee; }
h1 { margin: 0; font-size: clamp(16px, 3vw, 24px); }
p { margin: 0; overflow-wrap: anywhere; }
/* Reserved, always-visible status region: it holds the loading/fallback/final
   message and can never be covered by the canvas or controls. It wraps on
   narrow/portrait embeds (min-height for at least two lines of text). */
.status { flex: 0 0 auto; min-height: 2.8em; display: flex; flex-direction: column; gap: 2px; }
#status { font-weight: 600; }
#status[data-state="failed"], #status[data-state="device lost"] { color: #ff9b8a; }
canvas { display: block; width: 100%; height: 0; flex: 1 1 0; min-height: 0; background: #1b2332; }
canvas:focus-visible { outline: 2px solid #ffc76d; outline-offset: -2px; }
.controls { flex: 0 0 auto; display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 4px 10px; }
button[disabled] { opacity: 0.5; cursor: default; }
body:fullscreen { width: 100vw; height: 100vh; }
</style>
<h1>Ludus demo</h1>
<div class="status">
<p id="status" role="status" aria-live="polite" data-state="loading">Loading…</p>
<p id="notice" role="status" aria-live="polite" hidden></p>
<p id="instructions" hidden>Click the canvas, then use WASD or arrow keys to move. Click or drag to reposition.</p>
</div>
<canvas id="canvas" aria-label="Game canvas"></canvas>
<div class="controls">
<button id="restart" type="button">Restart</button>
<button id="stop" type="button" disabled>Stop</button>
<button id="fullscreen" type="button" disabled>Fullscreen</button>
</div>
<script>
var Module = {
  onAbort: function(reason) {
    document.getElementById('status').textContent = 'The game could not load. Please reload the page.';
    console.error('Ludus startup failed:', reason);
  }
};
const notice = document.getElementById('notice');
function fullscreenNotice(message) { notice.textContent = message; notice.hidden = !message; }
const statusEl = document.getElementById('status');
const stopButton = document.getElementById('stop');
const restartButton = document.getElementById('restart');
document.getElementById('restart').addEventListener('click', () => Module._Restart?.());
stopButton.addEventListener('click', () => Module._Stop?.());
const fullscreen = document.getElementById('fullscreen');
// Keep play controls (Stop, Fullscreen) inactive until the demo is playing;
// Restart stays available so a stopped/failed demo can be retried.
function syncControls() {
  const playing = statusEl.dataset.state === 'playing';
  stopButton.disabled = !playing;
  fullscreen.disabled = !playing && !document.fullscreenElement;
  restartButton.disabled = statusEl.dataset.state === 'loading';
}
new MutationObserver(syncControls).observe(statusEl, {attributes: true, attributeFilter: ['data-state']});
syncControls();
fullscreen.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.body.requestFullscreen) await document.body.requestFullscreen();
    else fullscreenNotice('Fullscreen is unavailable in this browser.');
  } catch (error) {
    fullscreenNotice('Fullscreen could not open. You can keep playing here.');
    console.warn('Ludus fullscreen:', error);
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreen.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  fullscreenNotice('');
});
</script>
<script src="index.js" onerror="document.getElementById('status').textContent='The game could not load. Please reload the page.'"></script>
</html>
