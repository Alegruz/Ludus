<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludus demo</title>
<style>
* { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; padding: 12px; display: flex; flex-direction: column;
  gap: 6px; font: 14px system-ui; background: #151923; color: #eee; }
h1 { margin: 0; font-size: clamp(16px, 3vw, 24px); }
p { margin: 0; overflow-wrap: anywhere; }
canvas { display: block; width: 100%; height: 0; flex: 1; min-height: 0; background: #1b2332; }
canvas:focus-visible { outline: 2px solid #ffc76d; outline-offset: -2px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 4px 10px; }
body:fullscreen { width: 100vw; height: 100vh; }
</style>
<h1>Ludus demo</h1>
<p id="status" role="status" aria-live="polite">Loading…</p>
<p id="notice" role="status" aria-live="polite" hidden></p>
<p id="instructions" hidden>Click the canvas, then use WASD or arrow keys to move. Click or drag to reposition.</p>
<canvas id="canvas" aria-label="Game canvas"></canvas>
<div class="controls">
<button id="restart" type="button">Restart</button>
<button id="stop" type="button">Stop</button>
<button id="fullscreen" type="button">Fullscreen</button>
</div>
<script>
var Module = {
  onAbort: function(reason) {
    document.getElementById('status').textContent = 'The game could not load. Please reload the page.';
    console.error('Ludus startup failed:', reason);
  }
};
const notice = document.getElementById('notice');
function fullscreenNotice(message) { notice.textContent = message; notice.hidden = !message; }
document.getElementById('restart').addEventListener('click', () => Module._Restart?.());
document.getElementById('stop').addEventListener('click', () => Module._Stop?.());
const fullscreen = document.getElementById('fullscreen');
fullscreen.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.body.requestFullscreen) await document.body.requestFullscreen();
    else fullscreenNotice('Fullscreen is unavailable in this browser.');
  } catch (error) {
    fullscreenNotice('Fullscreen could not open. You can keep playing here.');
    console.warn('Ludus fullscreen:', error);
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreen.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  fullscreenNotice('');
});
</script>
<script src="index.js" onerror="document.getElementById('status').textContent='The game could not load. Please reload the page.'"></script>
</html>
