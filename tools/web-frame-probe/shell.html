<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludus WebGPU frame rendering probe</title>
<style>
* { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; padding: 12px; display: flex; flex-direction: column;
  gap: 8px; font: 14px system-ui; background: #181821; color: #eee; }
h1 { margin: 0; font-size: clamp(16px, 3vw, 24px); }
p { margin: 0; overflow-wrap: anywhere; }
canvas { display: block; width: 100%; height: 0; flex: 1; min-height: 0; }
</style>
<h1>WebGPU frame rendering probe</h1>
<p id="status">Loading</p>
<canvas id="canvas" aria-label="Triangle canvas"></canvas>
<div><button onclick="Module._Restart()">Restart</button> <button onclick="Module._Stop()">Shutdown</button></div>
<script src="index.js"></script>
</html>
