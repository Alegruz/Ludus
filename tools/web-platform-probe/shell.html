<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Ludus browser platform probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
html { height: 100%; }
body { height: 100%; margin: 0; padding: 12px; display: flex; flex-direction: column;
  gap: 8px; font: 12px system-ui; background: #181821; color: #eee; }
h1 { margin: 0; font-size: clamp(16px, 3vw, 24px); }
p { margin: 0; }
#status { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
#stage { position: relative; flex: 1; min-height: 0; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; border: 0; padding: 0; background: #292b36; }
canvas:focus { outline: 2px solid #eee; outline-offset: -2px; }
#hint, #pointer { position: absolute; pointer-events: none; }
#hint { top: 8px; left: 8px; right: 8px; }
#pointer { top: 0; left: 0; width: 10px; height: 10px; background: #ffae65; }
#controls { display: flex; flex-wrap: wrap; gap: 8px; }
input { min-width: 0; width: 180px; max-width: 100%; }
#help { font-size: 11px; }
@media (max-height: 300px) { #help, h1 { display: none; } body { padding: 6px; gap: 4px; } }
</style>
<h1>Ludus browser platform probe</h1>
<p id="result" role="status">Loading…</p>
<p id="status"></p>
<div id="stage">
  <canvas id="canvas" aria-label="Game input canvas"></canvas>
  <span id="hint">Click here, then try W / arrows / pointer / wheel</span>
  <span id="pointer" hidden></span>
</div>
<div id="controls"><button id="restart">Restart backend</button> <input id="outside" aria-label="Outside game input" placeholder="Test focus loss"></div>
<p id="help">Input belongs to the focused canvas. Tab and browser shortcuts remain available.</p>
<script>
'use strict';
var Module = {
  arguments: new URLSearchParams(location.search).has('automated') ? ['automated'] : [],
  onAbort: function () { document.getElementById('result').textContent = 'W3 probe aborted'; },
};
document.getElementById('restart').addEventListener('click', function () { Module._W3Restart(); });
</script>
<script src="index.js"></script>
</html>
