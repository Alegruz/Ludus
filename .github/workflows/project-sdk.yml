name: project-sdk

# Installed host-tooling package checks. The Development job in ci.yml builds,
# installs and relocates the SDK once, and enforces the external consumer check.
# Release publication remains in release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Thanks to GitHub's "Concurrency" guidance: superseded PR checks can cancel.
# https://docs.github.com/en/actions/concepts/workflows-and-actions/concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-tooling:
    name: Host tooling (ludus_tools) unit tests
    runs-on: ubuntu-24.04
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/change-scope
        id: scope
      - name: Report documentation-only validation
        if: steps.scope.outputs.native_required == 'false'
        run: echo 'Documentation-only changes; native host-tooling validation skipped.'
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.native_required == 'true'
        with:
          python-version: "3.11"
      - name: Install the host tooling into a fresh venv at a new location
        if: steps.scope.outputs.native_required == 'true'
        run: |
          python3 -m venv /tmp/ludus-venv
          /tmp/ludus-venv/bin/pip install ./scripts/python
          /tmp/ludus-venv/bin/pip install cmake==3.29.6 ninja==1.11.1.3
      - name: Install native package inspection tools
        if: steps.scope.outputs.native_required == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-18 binutils
      - name: Prove the installed CLI runs with no checkout/Qt on the path
        if: steps.scope.outputs.native_required == 'true'
        run: |
          cd /tmp
          /tmp/ludus-venv/bin/ludus --version
          /tmp/ludus-venv/bin/ludus --store /tmp/store sdk list
          /tmp/ludus-venv/bin/python -c "import ludus_tools, sys; mods=[m for m in sys.modules if 'PyQt' in m or 'PySide' in m or m=='engine']; assert mods==[], mods; print('no Qt/engine imports')"
      - name: Run host-tooling unit/integration tests
        if: steps.scope.outputs.native_required == 'true'
        run: |
          cd scripts/python
          PATH=/tmp/ludus-venv/bin:$PATH python3 -m unittest test_editor_debugger test_editor_tool test_project_setup test_macos_project_tooling test_creation_engine test_ludus_tools test_ludus_project_ops test_ludus_cli test_ludus_failure_scenarios test_ludus_release test_ludus_itch_release test_macos_release test_ludus_butler -v

      - name: Exercise the installed release backend outside the checkout
        if: steps.scope.outputs.native_required == 'true'
        working-directory: /tmp
        run: |
          PATH=/tmp/ludus-venv/bin:$PATH PYTHONPATH=/tmp/ludus-venv/lib/python3.11/site-packages:${{ github.workspace }}/scripts/python /tmp/ludus-venv/bin/python -m unittest test_ludus_release test_ludus_itch_release test_macos_release test_ludus_butler -v

  butler-install:
    needs: host-tooling
    if: needs.host-tooling.outputs.native_required == 'true'
    name: Pinned butler installation (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone host tooling
        run: |
          python3 -m venv out/butler-cli-venv
          out/butler-cli-venv/bin/python -m pip install --no-deps ./scripts/python
      - name: Test installer contracts against the installed wheel
        run: |
          out/butler-cli-venv/bin/python -c 'import sys, unittest; sys.path.append("scripts/python"); unittest.main(module="test_ludus_butler", verbosity=2)'
      - name: Download verified host pin and execute only version
        run: out/butler-cli-venv/bin/python tests/sdk_consumer/verify_butler_install.py --cli "$PWD/out/butler-cli-venv/bin/ludus"
