name: Validate Dependency Versions

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'tools/onboard/**'
      - 'init*.bat'
      - 'init*.sh'
  push:
    branches:
      - main
      - develop

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    name: Validate dependency versions
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check version format
        id: format
        run: |
          python -c "
          import re
          from pathlib import Path
          
          cmake_file = Path('CMakeLists.txt').read_text()
          
          def extract_cmake_tag(var_name):
            match = re.search(rf'set\({var_name}\s+([^\)]+)\)', cmake_file)
            if not match:
              return None
            # Support optional quoted values in CMake set(...)
            return match.group(1).strip().strip('"\'')

          # Check VOLK_TAG format (must be vulkan-sdk-X.Y.Z.W)
          volk_tag = extract_cmake_tag('VOLK_TAG')
          if volk_tag:
            if not re.fullmatch(r'vulkan-sdk-\d+\.\d+\.\d+\.\d+', volk_tag):
              print(f'❌ ERROR: Invalid VOLK_TAG format: {volk_tag}')
              print('   Expected format: vulkan-sdk-X.Y.Z.W (e.g., vulkan-sdk-1.4.335.0)')
              exit(1)
            print(f'✅ VOLK_TAG format valid: {volk_tag}')
          
          # Check VULKAN_HEADERS_TAG format (must be vX.Y.Z)
          headers_tag = extract_cmake_tag('VULKAN_HEADERS_TAG')
          if headers_tag:
            if not re.fullmatch(r'v\d+\.\d+\.\d+', headers_tag):
              print(f'❌ ERROR: Invalid VULKAN_HEADERS_TAG format: {headers_tag}')
              print('   Expected format: vX.Y.Z (e.g., v1.3.275)')
              exit(1)
            print(f'✅ VULKAN_HEADERS_TAG format valid: {headers_tag}')
          "

      - name: Check for outdated versions
        run: |
          python tools/check_dependency_updates.py --check-only
          exit_code=$?
          if [ "$exit_code" -eq 1 ]; then
            echo "Updates available (non-fatal)."
            exit 0
          fi
          exit "$exit_code"

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Dependency version check failed. Please verify VOLK_TAG and VULKAN_HEADERS_TAG formats.'
            })
