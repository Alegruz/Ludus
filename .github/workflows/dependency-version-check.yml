name: Validate Dependency Versions

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'tools/onboard/**'
      - 'init*.bat'
      - 'init*.sh'
  push:
    branches:
      - main
      - develop

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    name: Validate dependency versions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check version format
        run: |
          python -c "
          import re
          from pathlib import Path
          
          cmake_file = Path('CMakeLists.txt').read_text()
          
          # Check VOLK_TAG format (must be vulkan-sdk-X.Y.Z.W)
          volk_match = re.search(r'set\(VOLK_TAG\s+(\S+)\)', cmake_file)
          if volk_match:
            tag = volk_match.group(1)
            if not re.match(r'vulkan-sdk-\d+\.\d+\.\d+\.\d+', tag):
              print(f'❌ ERROR: Invalid VOLK_TAG format: {tag}')
              print('   Expected format: vulkan-sdk-X.Y.Z.W (e.g., vulkan-sdk-1.4.335.0)')
              exit(1)
            print(f'✅ VOLK_TAG format valid: {tag}')
          
          # Check VULKAN_HEADERS_TAG format (must be vX.Y.Z)
          headers_match = re.search(r'set\(VULKAN_HEADERS_TAG\s+(\S+)\)', cmake_file)
          if headers_match:
            tag = headers_match.group(1)
            if not re.match(r'v\d+\.\d+\.\d+', tag):
              print(f'❌ ERROR: Invalid VULKAN_HEADERS_TAG format: {tag}')
              print('   Expected format: vX.Y.Z (e.g., v1.3.275)')
              exit(1)
            print(f'✅ VULKAN_HEADERS_TAG format valid: {tag}')
          "

      - name: Check for outdated versions
        run: python tools/check_dependency_updates.py --check-only

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Dependency version check failed. Please verify VOLK_TAG and VULKAN_HEADERS_TAG formats.'
            })
