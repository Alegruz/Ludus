name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      native_required: ${{ steps.scope.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/change-scope
        id: scope

  macos-compile:
    needs: changes
    if: needs.changes.outputs.native_required == 'true'
    name: macOS native backends and diagnostics
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream Clang 18
        run: brew install llvm@18
      - name: Prepare pinned native dependencies
        run: ./init.sh --cli --preset macos-clang-development --preset-only --locked --with-tests --no-system-install
      - name: Prepare pinned Metal shader compiler
        run: ./scripts/shader-probe bootstrap
      - name: Build all enabled engine and application targets
        run: |
          out/host-tools/venv/bin/cmake --preset macos-clang-development -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          ./scripts/build macos-clang-development
      - name: Test macOS setup contracts
        run: PYTHONPATH=scripts/python python3 -m unittest test_macos_setup test_init_launcher test_init_ui test_metal_shaders -v
      - name: Test native Cocoa, Metal, filesystem, Content and Audio
        env:
          LUDUS_TEST_COCOA: "1"
        run: out/host-tools/venv/bin/ctest --preset macos-clang-development --label-regex 'platform|macos|filesystem|content|audio|build-contract|diagnostic-startup' --no-tests=error
      - name: Test native Debug helper and explicit assertion decisions
        run: |
          ./init.sh --cli --preset macos-clang-debug --preset-only --locked --with-tests --no-system-install
          # Only these controlled test children enable dialog capability. Their
          # drivers clear CI and own a PTY; production builds remain noninteractive.
          out/host-tools/venv/bin/cmake --preset macos-clang-debug -DLUDUS_CI_BUILD=OFF -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          out/host-tools/venv/bin/cmake --build --preset macos-clang-debug --target ludus_diagnostic_startup_child ludus_assert_decision_child
          out/host-tools/venv/bin/ctest --preset macos-clang-debug --label-regex diagnostic-startup --no-tests=error
      - name: Analyze native diagnostic transport and startup sources
        run: |
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/base/src/diagnostic_output.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' tools/diagnostics/src/session.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-debug --warnings-as-errors='*' tools/diagnostics/tests/diagnostic_startup_child.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-debug --warnings-as-errors='*' tools/diagnostics/tests/assert_decision_child.cpp
      - name: Analyze Cocoa Objective-C++ production and test sources
        run: |
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/platform/src/window_cocoa.mm
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/platform/tests/cocoa_tests.mm
      - name: Analyze Metal production and rendering tests
        run: |
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/graphics/rhi/src/rhi_metal.mm
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/graphics/rhi/tests/metal_tests.mm
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/graphics/rhi/tests/render_tests.cpp
      - name: Verify installed Metal shader helper
        run: |
          out/host-tools/venv/bin/cmake --install out/build/macos-clang-development
          out/host-tools/venv/bin/python tests/sdk_consumer/verify_metal_shader_build.py --sdk "$PWD/out/install/macos-clang-development" --cmake "$PWD/out/host-tools/venv/bin/cmake" --ninja "$PWD/out/host-tools/venv/bin/ninja" --cxx "$PWD/out/host-tools/bin/clang++" --slang "$PWD/out/shader-tools/slang/bin/slangc" --conan "$PWD/out/conan/macos-clang-development" --sysroot "$PWD/out/host-tools/macos-sdk" --libcxx "$PWD/out/host-tools/libcxx-include"
      - name: Verify installed macOS game-project tooling
        run: |
          ./scripts/install-sdk macos-clang-development
          out/host-tools/venv/bin/python -m venv out/project-tooling-venv
          out/project-tooling-venv/bin/python -m pip install --no-deps ./scripts/python
          PATH="$PWD/out/host-tools/venv/bin:$PWD/out/host-tools/bin:$PATH" PYTHONPATH=scripts/python out/host-tools/venv/bin/python -m unittest test_project_setup test_macos_project_tooling test_creation_engine test_ludus_tools test_ludus_project_ops test_ludus_cli -v
          out/host-tools/venv/bin/python tests/sdk_consumer/verify_macos_project_tooling.py --sdk "$PWD/out/install/macos-clang-development" --tools "$PWD" --cli "$PWD/out/project-tooling-venv/bin/ludus"
      - name: Verify installed macOS diagnostic helper
        run: |
          out/host-tools/venv/bin/python tools/diagnostics/tests/startup_tests.py "$PWD/out/install/macos-clang-development/bin/ludus_diagnostic_helper" "$PWD/out/build/macos-clang-development/tools/diagnostics/ludus_diagnostic_startup_child" 0
      - name: Verify installed Content persistence
        run: |
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/content -B out/build/content-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_OSX_SYSROOT="$PWD/out/host-tools/macos-sdk" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem \"$PWD/out/host-tools/libcxx-include\"" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/macos-clang-development;$PWD/out/conan/macos-clang-development" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          out/host-tools/venv/bin/cmake --build out/build/content-consumer --parallel 2
          out/build/content-consumer/ludus_content_consumer
          out/host-tools/bin/clang-tidy -p out/build/content-consumer --warnings-as-errors='*' tests/sdk_consumer/content.cpp
      - name: Build and test the independent Cornell box tutorial (Metal)
        run: |
          export PATH="$PWD/out/host-tools/bin:$PWD/out/host-tools/venv/bin:$PATH"
          export LUDUS_SDK_PREFIX="$PWD/out/install/macos-clang-development;$PWD/out/conan/macos-clang-development"
          export LUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          export LUDUS_OSX_SYSROOT="$PWD/out/host-tools/macos-sdk"
          export LUDUS_LIBCXX_INCLUDE="$PWD/out/host-tools/libcxx-include"
          cd examples/cornell-box
          cmake --list-presets=configure
          cmake --list-presets=build
          cmake --list-presets=test
          cmake --preset macos-clang-development
          cmake --build --preset macos-clang-development
          ctest --preset macos-clang-development
          for source in src/main.cpp src/camera.cpp tests/camera_tests.cpp; do
            clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' "$source"
          done
          cmake --preset macos-clang-development -B out/sanitized -DCORNELL_ENABLE_SANITIZERS=ON
          cmake --build out/sanitized
          ctest --test-dir out/sanitized --output-on-failure --no-tests=error
          out/build/macos-clang-development/cornell_box.app/Contents/MacOS/cornell_box --frames=3
      - name: Build and run world demo with owned number parsing (Metal)
        timeout-minutes: 8
        run: |
          out/host-tools/venv/bin/cmake --preset macos-clang-development -DLUDUS_BUILD_WORLD_DEMO=ON -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          out/host-tools/venv/bin/cmake --build --preset macos-clang-development --target ludus_world_demo ludus_world_demo_tests ludus_world_demo_allocation_tests ludus_foundation_base_tests
          out/host-tools/venv/bin/ctest --preset macos-clang-development --tests-regex '^(ludus_foundation_base_tests|ludus_world_demo_tests|ludus_world_demo_allocation_tests|ludus_world_shader_layout)$' --no-tests=error
          out/build/macos-clang-development/apps/world_demo/ludus_world_demo --headless
          out/build/macos-clang-development/apps/world_demo/ludus_world_demo --frames 3
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/base/src/parse_number.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/base/tests/parse_number_tests.cpp
      - name: Analyze native filesystem production and test sources
        run: |
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/posix.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/file_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/posix_fault_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/namespace.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/namespace_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/namespace_fault_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/async.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/async_posix.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/async_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/async_fault_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/persistence_posix.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/watch.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' --extra-arg=-DLUDUS_FILESYSTEM_PERSISTENCE_FAULT_TESTING=1 modules/foundation/filesystem/src/persistence_posix.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' --extra-arg=-DLUDUS_FILESYSTEM_WATCH_FAULT_TESTING=1 modules/foundation/filesystem/src/watch.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/persistence_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/watch_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/persistence_fault_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/watch_fault_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/pack.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/src/pack_codec.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/pack_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/foundation/filesystem/tests/pack_fault_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/content/tests/native_reads_tests.cpp
      - name: Analyze Content native persistence and tests
        run: |
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/content/src/files.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' --extra-arg=-DLUDUS_CONTENT_SAVE_FAULT_TESTING=1 modules/content/src/files.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/content/tests/content_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/content/tests/native_saves_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/content/tests/save_fault_tests.cpp
      - name: Analyze native Audio workers, device adapter and regressions
        run: |
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/src/device.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/tests/device_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/tests/stream_tests.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/content/src/loader.cpp
          out/host-tools/bin/clang-tidy -p out/build/macos-clang-development --warnings-as-errors='*' modules/audio/content/tests/content_tests.cpp
      - name: Validate installed Audio SDK and native workers
        run: |
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/audio -B out/sdk-audio-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_OSX_SYSROOT="$PWD/out/host-tools/macos-sdk" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem \"$PWD/out/host-tools/libcxx-include\"" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/macos-clang-development;$PWD/out/conan/macos-clang-development" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          out/host-tools/venv/bin/cmake --build out/sdk-audio-consumer
          out/sdk-audio-consumer/ludus_audio_consumer
          out/host-tools/bin/clang-tidy -p out/sdk-audio-consumer --warnings-as-errors='*' tests/sdk_consumer/audio.cpp
      - name: Validate installed persistence and watcher SDK
        run: |
          out/host-tools/venv/bin/cmake -S tests/sdk_consumer/persistence -B out/sdk-persistence-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER="$PWD/out/host-tools/bin/clang++" \
            -DCMAKE_MAKE_PROGRAM="$PWD/out/host-tools/venv/bin/ninja" \
            -DCMAKE_OSX_SYSROOT="$PWD/out/host-tools/macos-sdk" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -isystem \"$PWD/out/host-tools/libcxx-include\"" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/macos-clang-development;$PWD/out/conan/macos-clang-development" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          out/host-tools/venv/bin/cmake --build out/sdk-persistence-consumer
          out/sdk-persistence-consumer/ludus_persistence_consumer
          out/host-tools/bin/clang-tidy -p out/sdk-persistence-consumer --warnings-as-errors='*' tests/sdk_consumer/persistence.cpp
      - name: Validate Cocoa, Metal, filesystem, Content and Audio with ASan and UBSan
        env:
          LUDUS_TEST_COCOA: "1"
        run: |
          ./init.sh --cli --preset macos-clang-asan-ubsan --preset-only --locked --with-tests --no-system-install
          out/host-tools/venv/bin/cmake --preset macos-clang-asan-ubsan -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          out/host-tools/venv/bin/cmake --build --preset macos-clang-asan-ubsan --target ludus_audio_tests ludus_audio_content_tests ludus_rhi_lifecycle_tests ludus_rhi_metal_tests ludus_rhi_render_tests ludus_platform_cocoa_tests ludus_platform_cocoa_keymap_tests ludus_filesystem_tests ludus_filesystem_fault_tests ludus_filesystem_namespace_fault_tests ludus_filesystem_pack_fault_tests ludus_filesystem_async_fault_tests ludus_filesystem_persistence_fault_tests ludus_filesystem_watch_fault_tests ludus_content_tests ludus_content_save_fault_tests
          out/host-tools/venv/bin/ctest --preset macos-clang-asan-ubsan --tests-regex '^ludus_((platform_cocoa(_keymap)?|filesystem(_fault|_namespace_fault|_pack_fault|_async_fault|_persistence_fault|_watch_fault)?|content(_save_fault)?|audio(_device|_content)?|rhi_(metal|lifecycle))_tests|rhi_render_pixels)$' --no-tests=error

      - name: Validate diagnostic stream and explicit decisions with ASan and UBSan
        run: |
          out/host-tools/venv/bin/cmake --preset macos-clang-debug -B out/build/macos-diagnostics-sanitized -DLUDUS_CI_BUILD=OFF -DLUDUS_ENABLE_ASAN=ON -DLUDUS_ENABLE_UBSAN=ON -DLUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          out/host-tools/venv/bin/cmake --build out/build/macos-diagnostics-sanitized --target ludus_diagnostic_startup_child ludus_assert_decision_child
          out/host-tools/venv/bin/ctest --test-dir out/build/macos-diagnostics-sanitized --label-regex diagnostic-startup --output-on-failure --no-tests=error

  formatting:
    needs: changes
    if: needs.changes.outputs.native_required == 'true'
    name: Source formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned formatter and GUI test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format-18 python3-venv python3-tk xvfb xauth liblz4-1
      - name: Install pinned CMake and Ninja for live project setup tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts/python")
          import engine
          root = Path.cwd()
          engine.create_or_update_venv(root)
          engine.install_managed_tools(root, engine.load_tool_versions(root))
          PY
          echo "$PWD/out/host-tools/venv/bin" >> "$GITHUB_PATH"
      - name: Test formatting and staged-file preservation
        run: python3 -m unittest discover -s scripts/python -p 'test_formatting.py' -v
      - name: Test reproducible packs with the independent LZ4 decoder
        run: python3 -m unittest discover -s scripts/python -p test_pack_builder.py -v
      - name: Test Metal shader reflection contracts
        run: PYTHONPATH=scripts/python python3 -m unittest test_metal_shaders -v
      - name: Test optional RAD tooling contracts
        run: python3 -m unittest discover -s scripts/python -p 'test_rad_debugger.py' -v
      - name: Test graphical and CLI initialization routing
        run: xvfb-run -a env LUDUS_TEST_GUI=1 python3 -m unittest discover -s scripts/python -p 'test_init*.py' -v
      - name: Test CI initialization and analysis contracts
        run: python3 -m unittest discover -s scripts/python -p 'test_ci.py' -v
      - name: Live reload tooling tests
        run: |
          python3 -m unittest discover -s scripts/python -p 'test_play*.py' -v
          python3 -m unittest discover -s scripts/python -p 'test_process_ownership.py' -v
      - name: Verify source formatting before builds
        run: ./scripts/check --format
      - name: Test S0 Luau source and bytecode integrity contracts
        run: python3 -m unittest discover -s tools/luau-probe -p 'test_*.py' -v
      - name: Test S1 manifest and cook admission contracts
        run: python3 -m unittest discover -s tools/script-cook -p 'test_*.py' -v

  debug-runtime:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Debug runtime and source debugger
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-debug
      - name: Build Debug with native gameplay fixtures
        run: ./scripts/build linux-clang-debug
      - name: Test Debug including mandatory GDB and persistent supervisor journeys
        run: out/host-tools/venv/bin/ctest --preset linux-clang-debug --no-tests=error
      - name: Preserve native debugger and supervisor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reload-debug-diagnostics
          path: out/build/linux-clang-debug/Testing/Temporary/
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  development:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Development and SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
      - name: Build Development without PCH
        run: ./scripts/build linux-clang-development
      - name: Validate private S0 Luau interpreter and debugger profile
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset linux-clang-development
          ./scripts/luau-probe check --preset linux-clang-development
      - name: Validate S1 generated contract and native/Luau interaction
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset linux-clang-development
          ./scripts/script-interaction check --preset linux-clang-development
      - name: Validate S2 debug, dependency cook and native VM replacement
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset linux-clang-development
          ./scripts/script-session check --preset linux-clang-development
      - name: Validate S4 installed provider and project cooker
        run: |
          ./scripts/script-provider run --preset linux-clang-development
          ./scripts/script-provider check --preset linux-clang-development
      - name: Validate S3 visual sequence and authoring ownership
        run: |
          ./scripts/visual-sequence cook
          ./scripts/visual-sequence run --preset linux-clang-development
          ./scripts/visual-sequence check --preset linux-clang-development
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned S3 authoring test browser
        working-directory: tools/web-browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise S3 designer author, review, debug and replacement journey
        run: node tools/visual-sequence/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-s3-authoring-evidence
          path: out/browser-qa/results/visual-s3*
          if-no-files-found: warn
      - name: Test Development
        run: out/host-tools/venv/bin/ctest --preset linux-clang-development --no-tests=error
      - name: Measure bounded filesystem reads and native syscall overhead
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -DLUDUS_BUILD_FILESYSTEM_BENCHMARK=ON
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development --target ludus_filesystem_benchmark --parallel 2
          python3 tests/filesystem/generate_benchmark.py out/filesystem-benchmark
          {
            uname -a
            lscpu
            for layout in loose raw.pack lz4.pack; do
              corpus=out/filesystem-benchmark
              if [ "$layout" = loose ]; then corpus="$corpus/loose"; fi
              for workers in 0 1 4; do
                sync
                sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'
                echo "cache_reset=drop_caches layout=$layout workers=$workers"
                out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark "$corpus" "$layout" "$workers"
              done
            done
          } | tee out/filesystem-benchmark/measurements.txt
          sudo apt-get update -qq
          sudo apt-get install -y strace
          for layout in loose raw.pack lz4.pack; do
            corpus=out/filesystem-benchmark
            if [ "$layout" = loose ]; then corpus="$corpus/loose"; fi
            strace -f -c -e trace=pread64,fstat,newfstatat,openat,close \
              -o "out/filesystem-benchmark/syscalls-$layout.txt" \
              out/build/linux-clang-development/modules/foundation/filesystem/ludus_filesystem_benchmark "$corpus" "$layout" 4
          done
      - name: Preserve filesystem measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-benchmark
          path: |
            out/filesystem-benchmark/measurements.txt
            out/filesystem-benchmark/syscalls-*.txt
      - name: Validate installed SDK and consumer
        run: ./scripts/install-sdk linux-clang-development
      - name: Cook and execute an independent project with the relocated Behavior SDK
        run: |
          python3 tools/script-provider/verify_consumer.py out/install/linux-clang-development
          python3 tools/script-provider/verify_optional.py linux-clang-development
      - name: Relocate the SDK and link a consumer without producer dependencies
        run: |
          set -euo pipefail
          reloc="$RUNNER_TEMP/relocated-sdk"
          cp -a out/install/linux-clang-development "$reloc"
          consumer="$RUNNER_TEMP/relocated-consumer"
          tools="$PWD/out/host-tools/venv/bin"
          env -i PATH="$tools:/usr/bin:/bin" "$tools/cmake" \
            -S tests/sdk_consumer -B "$consumer" -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$tools/ninja" \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-18 \
            -DCMAKE_PREFIX_PATH="$reloc" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          env -i PATH="$tools:/usr/bin:/bin" "$tools/cmake" --build "$consumer" --parallel 2
          "$consumer/ludus_sdk_consumer"
          if grep -q '/modules/' "$consumer/compile_commands.json"; then
            echo 'Relocated consumer compiled engine sources'; exit 1
          fi
      - name: Verify installed shader toolchain and generated backend contracts
        run: |
          ./scripts/shader-probe bootstrap
          ./scripts/bootstrap-spirv-cross
          python3 tests/sdk_consumer/verify_shader_build.py \
            --sdk "$PWD/out/install/linux-clang-development" \
            --cmake "$PWD/out/host-tools/venv/bin/cmake" \
            --ninja "$PWD/out/host-tools/venv/bin/ninja" \
            --cxx "$PWD/out/host-tools/bin/clang++" \
            --slang "$PWD/out/shader-tools/slang/bin/slangc" \
            --validator "$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val" \
            --spirv-cross "$PWD/out/shader-tools/spirv-cross/bin/spirv-cross" \
            --conan "$PWD/out/conan/linux-clang-development"
      - name: Build and test the independent Cornell box tutorial (Vulkan)
        run: |
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          export PATH="$PWD/out/host-tools/bin:$PWD/out/host-tools/venv/bin:$PATH"
          export LUDUS_SDK_PREFIX="$PWD/out/install/linux-clang-development"
          export LUDUS_SLANG_COMPILER="$PWD/out/shader-tools/slang/bin/slangc"
          export LUDUS_SPIRV_VALIDATOR="$PWD/out/shader-tools/spirv-tools/usr/bin/spirv-val"
          cd examples/cornell-box
          cmake --list-presets=configure
          cmake --list-presets=build
          cmake --list-presets=test
          cmake --preset linux-clang-development
          cmake --build --preset linux-clang-development
          ctest --preset linux-clang-development
          for source in src/main.cpp src/camera.cpp tests/camera_tests.cpp; do
            clang-tidy -p out/build/linux-clang-development --warnings-as-errors='*' "$source"
          done
          PYTHONPATH=../../scripts/python python3 - <<'PYFORMAT'
          from pathlib import Path
          from formatting import format_source
          sources = [*Path('src').glob('*.cpp'), *Path('src').glob('*.hpp'), *Path('tests').glob('*.cpp')]
          for source in sources:
              source = source.resolve()
              assert source.read_text() == format_source(source.read_text(), source, 'clang-format-18'), f'Format {source}'
          PYFORMAT
          # Exercise the same setup backend as Project > Repair Project Setup.
          # Start without local presets, then prove repeated repair stays usable.
          rm -rf out/build/linux-clang-development
          PYTHONPATH=../../scripts/python python -m ludus_tools project repair . --tools ../.. --sdk "$LUDUS_SDK_PREFIX" --no-web
          PYTHONPATH=../../scripts/python python -m ludus_tools project check . --tools ../..
          PYTHONPATH=../../scripts/python python -m ludus_tools project repair . --tools ../.. --sdk "$LUDUS_SDK_PREFIX" --no-web
          git diff --exit-code -- .gitignore ludus.project.json CMakePresets.json
          cmake --preset linux-clang-development -B out/sanitized -DCORNELL_ENABLE_SANITIZERS=ON
          cmake --build out/sanitized
          ctest --test-dir out/sanitized --output-on-failure --no-tests=error
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  sanitizers:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-asan-ubsan
          editor: 'true'
      - name: Build with sanitizers
        run: ./scripts/build linux-clang-asan-ubsan
      - name: Validate S0 Luau allocation failure and lifetime profile with sanitizers
        run: |
          ./scripts/luau-probe bootstrap
          ./scripts/luau-probe cook
          ./scripts/luau-probe run --preset linux-clang-asan-ubsan
      - name: Validate S1 unpublished effects under allocation failure
        run: |
          ./scripts/script-interaction bootstrap
          ./scripts/script-interaction cook
          ./scripts/script-interaction run --preset linux-clang-asan-ubsan
      - name: Validate S2 staging, paused invocation and module retirement with sanitizers
        run: |
          ./scripts/script-session cook
          ./scripts/script-session run --preset linux-clang-asan-ubsan
      - name: Validate S3 graph debugger, candidate failure and owner retirement with sanitizers
        run: ./scripts/visual-sequence run --preset linux-clang-asan-ubsan
      - name: Validate S4 provider transactions and state under sanitizers
        run: ./scripts/script-provider run --preset linux-clang-asan-ubsan
      - name: Test with sanitizers
        env:
          LUDUS_RELOAD_METRICS: ${{ runner.temp }}/live-reload-asan-ubsan.jsonl
        run: out/host-tools/venv/bin/ctest --preset linux-clang-asan-ubsan --no-tests=error
      - name: Upload sanitizer reload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reload-asan-ubsan
          path: ${{ runner.temp }}/live-reload-asan-ubsan.jsonl
          if-no-files-found: error
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  filesystem-fuzz:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Filesystem pack fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          conan-cache-writer: 'false'
          compiler-cache-writer: 'false'
      - name: Build fully instrumented reader and decoder
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/filesystem-fuzz -DLUDUS_BUILD_FILESYSTEM_FUZZERS=ON
          out/host-tools/venv/bin/cmake --build out/build/filesystem-fuzz --target ludus_filesystem_pack_fuzzer --parallel 2
          out/host-tools/bin/clang-tidy -p out/build/filesystem-fuzz --warnings-as-errors='*' modules/foundation/filesystem/tests/pack_fuzzer.cpp
      - name: Fuzz seeded indexes and independent decode under ASan and UBSan
        run: |
          python3 tests/filesystem/generate_pack_fixtures.py out/fuzz/fixture.hpp --corpus out/fuzz/corpus
          out/build/filesystem-fuzz/modules/foundation/filesystem/ludus_filesystem_pack_fuzzer out/fuzz/corpus -max_total_time=60 -max_len=65536 -timeout=2 -rss_limit_mb=512 -artifact_prefix=out/fuzz/
      - name: Preserve reproducible corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-pack-fuzz
          path: out/fuzz/
          if-no-files-found: warn

  threading-races:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Threading race detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          cache-variant: threading-tsan
          conan-cache-writer: 'false'
      - name: Configure and build the threading kernel with TSan
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/threading-tsan \
            -DLUDUS_ENABLE_TSAN=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/threading-tsan --parallel 2 \
            --target ludus_foundation_threading_tests ludus_threading_startup_tests ludus_filesystem_tests ludus_filesystem_async_fault_tests
      - name: Test dependencies, publication, cancellation and startup with TSan
        run: out/host-tools/venv/bin/ctest --test-dir out/build/threading-tsan --tests-regex "ludus_(foundation_threading|threading_startup|filesystem|filesystem_async_fault)_tests" --output-on-failure --no-tests=error
      - name: Preserve race-detection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threading-tsan
          path: out/build/threading-tsan/Testing/Temporary/
          if-no-files-found: error

  analysis:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Clang static analysis (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    env:
      LUDUS_TIDY_JOBS: "2"
      LUDUS_TIDY_SHARD_COUNT: "2"
      LUDUS_TIDY_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          conan-cache-writer: 'false'
          compiler-cache-writer: 'false'
      # Generated headers/sources must exist before analyzing the compile database.
      - name: Build analysis inputs
        run: ./scripts/build linux-clang-development
      - name: Analyze every project translation unit
        run: ./scripts/check linux-clang-development --tidy
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  editor:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Optional editor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          editor: 'true'
          cache-variant: editor
          conan-cache-writer: 'false'
      - name: Build editor tests without rebuilding every engine test target
        run: out/host-tools/venv/bin/cmake --build --preset linux-clang-development --target ludus_editor_tests
      - name: Verify editor initialization and offscreen tests
        run: out/host-tools/venv/bin/ctest --preset linux-clang-development --label-regex '^editor$' --no-tests=error
      - name: Measure the content browser projection
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out/build/linux-clang-development/apps/editor/ludus_editor_tests '[content][scale]' --success > out/editor-content-scale.txt
          tee -a "$GITHUB_STEP_SUMMARY" < out/editor-content-scale.txt
      - uses: actions/upload-artifact@v4
        with:
          name: editor-content-scale
          path: out/editor-content-scale.txt
      - name: Analyze document interactions and regressions
        run: |
          out/host-tools/bin/clang-tidy -p out/build/linux-clang-development --warnings-as-errors='*' \
            apps/editor/src/controller.cpp apps/editor/src/main_window.cpp \
            apps/editor/src/main_window_layout.cpp apps/editor/src/document_commands.cpp \
            apps/editor/src/configuration_workspace.cpp apps/editor/src/audio_workspace.cpp \
            apps/editor/src/audio_preview.cpp \
            apps/editor/tests/document_history_tests.cpp apps/editor/tests/document_interaction_tests.cpp \
            apps/editor/src/content_catalog_model.cpp apps/editor/src/content_import.cpp \
            apps/editor/src/content_jobs.cpp apps/editor/src/content_workspace.cpp \
            apps/editor/tests/content_browser_tests.cpp apps/editor/tests/content_import_gate_tests.cpp \
            apps/editor/src/controller_play.cpp apps/editor/src/script_workspace.cpp \
            apps/editor/tests/script_workspace_tests.cpp
      - name: Verify S5 Editor, installed Behavior SDK and GameHost journey
        run: |
          ./scripts/script-provider bootstrap
          out/host-tools/venv/bin/cmake --preset linux-clang-development \
            -DLUDUS_BUILD_SCRIPT_INTERACTION=OFF -DLUDUS_BUILD_SCRIPT_SESSION=OFF \
            -DLUDUS_BUILD_VISUAL_SEQUENCE=OFF
          ./scripts/script-provider run --preset linux-clang-development
          out/host-tools/venv/bin/cmake --build --preset linux-clang-development
          out/host-tools/venv/bin/cmake --install out/build/linux-clang-development
          QT_QPA_PLATFORM=offscreen LUDUS_SDK_PREFIX="$PWD/out/install/linux-clang-development" \
            out/build/linux-clang-development/apps/editor/ludus_editor_tests '[.script-journey]'
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  # Debug runtime already runs the complete Debug assertion/build contracts.
  assertion-policy:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Assertion policy (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-profile, linux-clang-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: ${{ matrix.preset }}
      - name: Build and test all assertion policies including Release
        run: |
          out/host-tools/venv/bin/cmake --preset ${{ matrix.preset }} -B out/build/assertion-policy -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/assertion-policy --parallel 2
          out/host-tools/venv/bin/ctest --test-dir out/build/assertion-policy --output-on-failure
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  pch:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: PCH build (LUDUS_ENABLE_PCH=ON)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          cache-variant: pch
          conan-cache-writer: 'false'
      - name: Configure, build, and test with the foundational PCH enabled
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/pch \
            -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON -DLUDUS_ENABLE_PCH=ON
          out/host-tools/venv/bin/cmake --build out/build/pch --parallel 2
          # Compile-policy/header contracts run in the non-PCH jobs; their
          # standalone reparsing does not support injected PCH flags.
          out/host-tools/venv/bin/ctest --test-dir out/build/pch --output-on-failure --label-exclude build-contract
      - name: Report compiler cache
        if: always()
        run: ccache --show-stats >> "$GITHUB_STEP_SUMMARY"

  build-budget:
    needs: [changes, formatting]
    if: needs.changes.outputs.native_required == 'true'
    name: Build-time budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-setup
        with:
          preset: linux-clang-development
          compiler-cache: 'false'
          conan-cache-writer: 'false'
      # Setup only: --ci would repeat all native validation before profiling.
      # Keep the clean profile uncached and concurrency stable for timing budgets.
      - name: Enforce build-time budget
        run: ./scripts/check-build-budget --profile
      - name: Publish build-time profile summary
        if: always()
        run: |
          echo "### Build-time budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Time summary/,/Expensive headers/p' out/profile/*-analysis.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Save detailed build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-profile
          path: out/profile/
          if-no-files-found: warn

  linux:
    # Thanks to GitHub, "Using conditions to control job execution": keep the
    # required check present, and allow skipped native jobs only for docs-only
    # changes whose classification and routing regressions succeeded.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
    name: Ubuntu Clang
    needs: [changes, macos-compile, formatting, debug-runtime, development, sanitizers, filesystem-fuzz, threading-races, analysis, editor, assertion-policy, pch, build-budget]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce validation for the classified change scope
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/python/ci_scope.py gate
