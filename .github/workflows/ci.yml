name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: Ubuntu Clang
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      LUDUS_ENABLE_CCACHE: "1"
      # Diagnostics stay report-only in CI. CI is auto-detected, but set the
      # noninteractive policy explicitly so an interactive assertion prompt can
      # never hang a runner even if detection changes.
      LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('config/tool_versions.json') }}

      - name: Cache Conan package cache
        uses: actions/cache@v4
        with:
          path: out/conan/home
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'config/conan/profiles/linux-clang-x86_64', 'conan.lock') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      - name: Initialize, build, test, check, and validate SDK
        run: |
          start_time=$(date +%s)
          ./init.sh --ci --validate
          end_time=$(date +%s)
          echo "LUDUS_BUILD_WALL_SECONDS=$(( end_time - start_time ))" >> "$GITHUB_ENV"

      - name: Print build wall-time and ccache statistics
        if: always()
        run: |
          echo "### Build metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total wall-time | ${LUDUS_BUILD_WALL_SECONDS:-?}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ccache statistics" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "--- ccache stats ---"
          ccache --show-stats

  assertion-policy:
    name: Assertion policy (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang-debug, linux-clang-profile, linux-clang-release]
    env:
      CI: "true"
      # Report-only diagnostics: even the Debug preset here must not attempt an
      # interactive assertion prompt on a headless runner.
      LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare selected dependencies
        run: ./init.sh --preset-only ${{ matrix.preset }}
      - name: Build with tests even for the production Release policy
        run: |
          out/host-tools/venv/bin/cmake --preset ${{ matrix.preset }} -B out/build/assertion-policy -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON
          out/host-tools/venv/bin/cmake --build out/build/assertion-policy --parallel 2
          out/host-tools/venv/bin/ctest --test-dir out/build/assertion-policy --output-on-failure

  pch:
    # Verifies the optional precompiled-header path builds and tests pass. The
    # primary "Ubuntu Clang" job above builds with LUDUS_ENABLE_PCH OFF (the
    # default), which is the "no-pch" guarantee: no translation unit may rely on
    # a symbol that only the PCH provides. This job flips the option ON so both
    # configurations are exercised on every change. See cmake/EnginePch.cmake and
    # docs/architecture/foundational-headers.md Section 10.
    name: PCH build (LUDUS_ENABLE_PCH=ON)
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Wayland development packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev wayland-protocols
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('config/tool_versions.json') }}
      - name: Cache Conan package cache
        uses: actions/cache@v4
        with:
          path: out/conan/home
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'config/conan/profiles/linux-clang-x86_64', 'conan.lock') }}
      - name: Prepare toolchain and dependencies
        run: ./init.sh --preset-only linux-clang-development
      - name: Configure, build, and test with the foundational PCH enabled
        run: |
          out/host-tools/venv/bin/cmake --preset linux-clang-development -B out/build/pch \
            -DLUDUS_BUILD_TESTS=ON -DLUDUS_WARNINGS_AS_ERRORS=ON -DLUDUS_ENABLE_PCH=ON
          out/host-tools/venv/bin/cmake --build out/build/pch --parallel 2
          # This job's purpose is to prove the engine + tests BUILD and the
          # functional/runtime tests PASS with the PCH on. The build-contract
          # tests introspect compile_commands.json to verify source/policy
          # invariants (exception policy, assertion-config overrides, header
          # self-sufficiency); those invariants are independent of the PCH and
          # are already fully exercised by the non-PCH jobs. Under a
          # PCH-augmented compile database they would re-parse the injected
          # precompiled-header flags, which is out of their scope, so exclude
          # the build-contract label here.
          out/host-tools/venv/bin/ctest --test-dir out/build/pch --output-on-failure --label-exclude build-contract

  build-budget:
    # Heavy, separate job: -ftime-trace + ClangBuildAnalyzer are slow, so this is
    # kept out of the fast "Ubuntu Clang" job and the local iteration loop. It
    # enforces the per-header / total parse-time budgets in config/build_budget.json
    # (see docs/decisions/0005-build-time-budgets.md). Wayland is installed so the
    # full build graph (including the Wayland backend) is profiled.
    name: Build-time budget
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      LUDUS_DIAGNOSTIC_INTERACTIVE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Wayland development packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev wayland-protocols

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('config/tool_versions.json') }}

      - name: Cache Conan package cache
        uses: actions/cache@v4
        with:
          path: out/conan/home
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'config/conan/profiles/linux-clang-x86_64', 'conan.lock') }}

      - name: Prepare toolchain and dependencies
        run: ./init.sh --ci

      - name: Enforce build-time budget
        run: ./scripts/check-build-budget --profile

      - name: Publish build-time profile summary
        if: always()
        run: |
          echo "### Build-time budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Time summary/,/Expensive headers/p' out/profile/*-analysis.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
